# Reusable: builds the Toolbot image, smoke-tests it, and optionally pushes a
# multi-arch image to GHCR with a signed build-provenance attestation.
# Called by image.yml (pull requests, main) and release.yml (version tags).
name: Image build

on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR after the smoke test passes
        type: boolean
        default: false
      version:
        description: Release version (X.Y.Z) to tag, in addition to sha-<commit>
        type: string
        default: ""
    outputs:
      image:
        description: Image name without tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the pushed image (empty when not pushed)
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build, smoke-test${{ inputs.push && ', push' || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image name, version and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/toolbot"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$version" ]; then
            echo "::error::release version $INPUT_VERSION does not match pyproject.toml version $version"
            exit 1
          fi
          tags="$image:sha-${GITHUB_SHA::7}"
          [ -n "$INPUT_VERSION" ] && tags="$tags,$image:$INPUT_VERSION"
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.push
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for smoke test (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: toolbot:ci
          build-args: |
            TOOLBOT_VERSION=${{ steps.meta.outputs.version }}
            TOOLBOT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: sh scripts/smoke-test-image.sh toolbot:ci

      - name: Validate this repository's tool definitions with the image
        run: docker run --rm -v "$PWD:/work:ro" -w /work toolbot:ci sh -c 'toolbot validate && toolbot verify'

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TOOLBOT_VERSION=${{ steps.meta.outputs.version }}
            TOOLBOT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # GitHub attestation below instead of BuildKit's, which adds
          # "unknown/unknown" platform entries some registries display badly.
          provenance: false
          cache-from: type=gha

      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Toolbot image"
            if [ "$PUSHED" = "true" ]; then
              echo "Pushed \`${TAGS//,/\`, \`}\`"
              echo ""
              echo "Digest: \`$DIGEST\`"
            else
              echo "Built and smoke-tested (not pushed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
