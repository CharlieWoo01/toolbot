# Weekly live tests against real upstream releases (GitHub: Pact Broker CLI,
# GitLab: glab). Catches upstream API or release-layout changes that the
# mocked tests cannot.
name: Integration

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live upstreams
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock
      - run: pip install --constraint requirements.lock -e ".[dev]"
      - run: pytest -m integration
        env:
          # Read-only workflow token: avoids anonymous GitHub API rate limits.
          TOOLBOT_GITHUB_TOKEN: ${{ github.token }}
