[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "toolbot"
version = "0.1.0"
description = "Automated update requests for standalone development and CI tools distributed as release artifacts."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.28,<1",
    "PyYAML>=6.0.2,<7",
    "semver>=3.0.4,<4",
    "packaging>=24",
]

[project.optional-dependencies]
# Development and docs tooling is pinned exactly so CI results only change when
# these pins change.
dev = [
    "pytest==9.1.1",
    "mypy==2.3.1",
    "ruff==0.16.9",
    "types-PyYAML==6.0.12.20260906",
]
docs = [
    "mkdocs==1.6.1",  # MkDocs 2.0 is incompatible with Material's plugins/themes
    "mkdocs-material==9.7.7",
]

[project.scripts]
toolbot = "toolbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests only run when selected explicitly: pytest -m integration
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: talks to real GitHub/GitLab"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603", # subprocess with argument lists is the intended, safe pattern
    "S607", # "git" is resolved from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501", "RUF012"]
