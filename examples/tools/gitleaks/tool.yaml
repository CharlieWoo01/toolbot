# yaml-language-server: $schema=../../../schema/tool.schema.json
#
# gitleaks — secret scanner.
#
# WHAT THIS EXAMPLE SHOWS: one shared checksum file whose NAME contains the
# version, so {version} is used in `checksum.file` as well as in asset names.
#
# Upstream:  https://github.com/gitleaks/gitleaks/releases
#   tag       v8.30.1
#   assets    gitleaks_8.30.1_windows_x64.zip
#             gitleaks_8.30.1_linux_x64.tar.gz
#             gitleaks_8.30.1_checksums.txt      ("<sha256>  <file>" per line)

name: gitleaks
version: "8.30.0"
tag: v{version}

source:
  provider: github
  repository: gitleaks/gitleaks

checksum:
  type: file
  file: gitleaks_{version}_checksums.txt

assets:
  windows-amd64:
    name: gitleaks_{version}_windows_x64.zip
    destination: windows-amd64/gitleaks.zip
  linux-amd64:
    name: gitleaks_{version}_linux_x64.tar.gz
    destination: linux-amd64/gitleaks.tar.gz
