# yaml-language-server: $schema=../../../schema/tool.schema.json
#
# Pact CLI — the unified Rust `pact` command (broker, mock server, verifier…).
#
# WHAT THIS EXAMPLE SHOWS: the simplest common case, the same shape as
# tools/pact-broker-cli. Asset names do NOT contain the version, and every
# archive has its own SHA-256 "sidecar" file next to it.
#
# Upstream:  https://github.com/pact-foundation/pact-cli/releases
#   tag       v0.10.8
#   assets    pact-x86_64-pc-windows-msvc.zip
#             pact-x86_64-pc-windows-msvc.zip.sha256     ("<sha256> *<file>")
#             pact-x86_64-unknown-linux-musl.tar.xz
#             pact-x86_64-unknown-linux-musl.tar.xz.sha256

name: pact-cli
version: "0.10.7"
tag: v{version}

source:
  provider: github
  repository: pact-foundation/pact-cli

checksum:
  type: file
  file: "{asset}.sha256"        # {asset} = the upstream file being verified

assets:
  windows-amd64:
    name: pact-x86_64-pc-windows-msvc.zip
    destination: windows-amd64/pact.zip
  linux-amd64:
    # musl build: static, runs on any Linux distribution (incl. Alpine CI images)
    name: pact-x86_64-unknown-linux-musl.tar.xz
    destination: linux-amd64/pact.tar.xz
