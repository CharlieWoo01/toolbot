site_name: Toolbot
site_description: Automated update requests for standalone tools, CLIs and binary release artifacts.
docs_dir: docs
strict: true

theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }

nav:
  - Home: index.md
  - Guide:
      - Introduction: guide/introduction.md
      - Quick start: guide/quick-start.md
      - Adding a tool: guide/adding-a-tool.md
      - What can be updated: guide/what-can-be-updated.md
      - Examples: guide/examples.md
      - Tags & asset matching: guide/matching.md
      - Versions, prereleases & ignoring: guide/versions.md
      - Checksums: guide/checksums.md
      - Providers: guide/providers.md
      - Hosts (public & internal): guide/hosts.md
      - Update lifecycle: guide/lifecycle.md
      - Reviewing update MRs: guide/reviewing.md
      - Security model: guide/security.md
      - Troubleshooting: guide/troubleshooting.md
  - Deploy:
      - Overview: deploy/overview.md
      - GitLab CI: deploy/gitlab.md
      - GitHub Actions: deploy/github-actions.md
      - Control repository (GitOps): deploy/control-repository.md
      - Running locally: deploy/local.md
      - Container image: deploy/image.md
      - Docker, Kubernetes & other CI: deploy/anywhere.md
      - Creating tokens: deploy/creating-tokens.md
      - Tokens & permissions: deploy/tokens.md
      - Proxies & internal networks: deploy/networking.md
      - Upgrading: deploy/upgrading.md
  - Reference:
      - tool.yaml: reference/tool-yaml.md
      - CLI: reference/cli.md
      - Environment variables: reference/environment.md
      - Lock file: reference/lock-file.md
      - CI template: reference/ci-template.md
  - Contributing:
      - Development: contributing/development.md
      - Adding a provider: contributing/adding-a-provider.md
      - Releasing: contributing/releasing.md
