# Toolbot CI template for GitLab projects: repositories that keep tools under
# tools/<name>/, and control repositories with a toolbot.yaml.
#
#   include:
#     - project: platform/toolbot          # wherever the Toolbot project lives
#       ref: v0.1.0                        # pin to a release tag
#       file: /templates/toolbot.gitlab-ci.yml
#
#   variables:
#     TOOLBOT_IMAGE: registry.example.com/platform/toolbot:0.1.0
#
# Jobs (both in stage "test"; override `stage:` on the job to move them):
#   toolbot-verify  merge requests / default branch: validate definitions and
#                   toolbot.yaml, check committed artifacts match their lock files.
#   toolbot-check   pipeline schedules (and manual runs) with TOOLBOT_RUN=true.
#                   TOOLBOT_CHECK_ARGS adds arguments, e.g. "--dry-run" or
#                   "--targets nightly" (one schedule per target set).
#
# CI/CD variables (masked, protected): TOOLBOT_GITLAB_TOKEN for this project,
# or the token-env names declared in toolbot.yaml.

variables:
  TOOLBOT_IMAGE:
    description: "Toolbot image, pinned to a version, e.g. registry.example.com/platform/toolbot:0.1.0"
    value: ""
  TOOLBOT_CHECK_ARGS:
    description: 'Extra arguments for "toolbot check", e.g. "--dry-run" or "--targets nightly"'
    value: ""

.toolbot:
  image: $TOOLBOT_IMAGE
  stage: test

toolbot-verify:
  extends: .toolbot
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $TOOLBOT_IMAGE == null || $TOOLBOT_IMAGE == ""
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [tools/*/tool.yaml, toolbot.yaml]
  script:
    - toolbot validate
    - toolbot verify

toolbot-check:
  extends: .toolbot
  rules:
    # Only schedules/manual runs that opt in, so other schedules are unaffected.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $TOOLBOT_RUN == "true" && $TOOLBOT_IMAGE
    - if: $CI_PIPELINE_SOURCE == "web" && $TOOLBOT_RUN == "true" && $TOOLBOT_IMAGE
  # Never run two Toolbot instances from this project at once.
  resource_group: toolbot
  timeout: 1h
  script:
    # Toolbot fetches each target branch itself; the job checkout is only
    # read for toolbot.yaml and by --dry-run without a target.
    - toolbot check $TOOLBOT_CHECK_ARGS
